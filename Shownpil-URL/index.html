<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>URL 변환</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <h2>
        로그인
    </h2>


    <form
        action="/login"
        method="POST"
    >

        <label for="userId">
            사용자 ID
        </label>

        <input
            type="text"
            id="userId"
            name="userId"
            placeholder="사용자 ID..."
            required
        >


        <label for="password">
            암호
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="암호..."
            required
        >


        <button
            type="submit"
            class="login-button"
        >
            로그인
        </button>

    </form>

</body>

</html>
